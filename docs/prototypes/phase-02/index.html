<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校招岗位工作台 · Phase 02 原型</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">OFFICIAL CAMPUS RADAR · PROTOTYPE · CYCLE 06</p>
        <h1>校招岗位工作台</h1>
        <p class="subtitle">一行看完一家公司的招聘批次、代表岗位、地点、进度和官方入口。</p>
      </div>
      <nav aria-label="页面视图">
        <button class="nav-button active" data-view="active">招聘中</button>
        <button class="nav-button" data-view="history">历史</button>
        <button class="update-button" disabled title="原型不会执行真实更新">立即更新</button>
      </nav>
    </header>

    <section class="prototype-note" role="note">
      <strong>模拟数据，不是线上岗位</strong>
      <span>这个页面只验证布局和交互，不连接 Django、数据库或企业网站。</span>
    </section>

    <section class="health-panel" data-health="healthy">
      <div>
        <span class="health-dot"></span>
        <strong class="health-title">运行正常</strong>
        <span class="health-copy">最近成功更新：今天 08:20</span>
      </div>
      <div class="health-switch" aria-label="模拟运行状态">
        <button data-health-choice="healthy" class="selected">正常</button>
        <button data-health-choice="missing">漏跑</button>
        <button data-health-choice="failure">来源失败</button>
      </div>
    </section>

    <section class="panel filters compact-filters">
      <form id="filter-form">
        <input name="company" aria-label="公司名称" placeholder="公司名称">
        <div class="multi-filter" data-filter="companyType" data-label="公司类型">
          <button class="multi-trigger" type="button" aria-expanded="false">公司类型</button>
          <div class="multi-menu" hidden><div class="multi-options"></div><div class="multi-message"></div><footer><button type="button" class="multi-cancel">取消</button><button type="button" class="multi-confirm">确定</button></footer></div>
        </div>
        <div class="multi-filter" data-filter="location" data-label="地点" data-max="5">
          <button class="multi-trigger" type="button" aria-expanded="false">地点（省份，最多 5 个）</button>
          <div class="multi-menu province-menu" hidden><div class="multi-options"></div><div class="multi-message">最多选择 5 个省份</div><footer><button type="button" class="multi-cancel">取消</button><button type="button" class="multi-confirm">确定</button></footer></div>
        </div>
        <div class="multi-filter" data-filter="recruitmentType" data-label="招聘类型">
          <button class="multi-trigger" type="button" aria-expanded="false">招聘类型</button>
          <div class="multi-menu" hidden><div class="multi-options"></div><div class="multi-message"></div><footer><button type="button" class="multi-cancel">取消</button><button type="button" class="multi-confirm">确定</button></footer></div>
        </div>
        <select name="audience" aria-label="招聘对象"><option value="">招聘对象</option><option>2024届</option><option>2025届</option><option>2026届</option><option>2027届</option><option>2028届</option><option>实习生</option></select>
        <input name="position" aria-label="岗位" placeholder="岗位（多个用逗号隔开）">
        <div class="multi-filter" data-filter="progress" data-label="投递进度">
          <button class="multi-trigger" type="button" aria-expanded="false">投递进度</button>
          <div class="multi-menu" hidden><div class="multi-options"></div><div class="multi-message"></div><footer><button type="button" class="multi-cancel">取消</button><button type="button" class="multi-confirm">确定</button></footer></div>
        </div>
        <select name="deadlineWindow" aria-label="截止时间"><option value="">截止时间</option><option value="1">1 天内截止</option><option value="3">3 天内截止</option><option value="7">7 天内截止</option><option value="unknown">招满为止 / 未说明</option></select>
        <div class="form-actions wide"><button class="primary-button" type="submit">查询</button><button id="reset-filters" class="reset-button" type="button">重置</button><strong id="filter-summary"></strong></div>
      </form>
    </section>

    <section class="results-heading">
      <div><span class="section-index">02</span><h2 id="results-title">招聘中的批次</h2></div>
      <span id="batch-count"></span>
    </section>
    <section id="batch-list" class="table-shell" aria-live="polite"></section>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
